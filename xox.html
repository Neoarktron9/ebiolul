  .blur-accent-bar {
    position: absolute;
    inset-block: 8px;
    left: 14px;
    width: 5px;
    border-radius: 20px;
    background: linear-gradient(180deg, #ffc482, #82f7ff);
    box-shadow: 0 0 16px rgba(130, 247, 255, 0.5);
    animation: pulse-accent-bar 2.6s ease-in-out infinite;

    0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 8px rgba(130,247,255,0.4)); }

              <div class="avatar-frame-container rounded-full frame-white svelte-j5235y" style="--border-width: 4px; --avatar-size: 128px; --container-size: 136px;">
                <div class="avatar-image rounded-full svelte-j5235y" style="width: 128px; height: 128px;">
                  <div class="avatar-slot w-full h-full rounded-full svelte-j5235y"></div>
                </div>
                <div class="frame-border rounded-full svelte-j5235y"></div>
              </div>
            </div>
            <div class="flex-1">
              <div class="flex items-center gap-2">
                <h1 class="profile-name-target text-3xl font-bold svelte-tdcaal">xxx</h1>
              </div>
              <div class="profile-handle-target mt-1 text-sm text-neutral-400 font-mono">@xox</div>
              <div class="profile-bio-target mt-2 text-xs text-neutral-300 font-sans" style="display:none;"></div>
              <div class="profile-socials-target flex flex-wrap gap-2 mt-4"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="relative z-10 flex w-full flex-col items-center p-6">
        <div class="profile-modules-target flex w-full max-w-xl flex-col gap-5">
          <div class="bg-[#141414] text-white border-[#222222] rounded-lg border shadow-sm p-12 text-center">
            <p class="text-neutral-400 text-sm">No modules configured for this profile yet.</p>
          </div>
        </div>
      </div>
    </div>
  `
};

function renderActiveProfileTheme() {
  const root = document.getElementById('theme-root');
  if (!root) return;

  // 1. Get Active Theme
  let activeThemeKey = (localStorage.getItem('ebio_active_theme') || '3D-PROFILE').toUpperCase().replace(/\s+/g, '-');
  if (!THEMES[activeThemeKey]) activeThemeKey = '3D-PROFILE';

  // Inject Theme HTML
  root.innerHTML = THEMES[activeThemeKey];

  // 2. Populate User Avatar
  const avatar = localStorage.getItem('ebio_workspace_avatar');
  const avatarSlots = document.querySelectorAll('.avatar-slot');
  avatarSlots.forEach(slot => {
    if (avatar) {
      slot.innerHTML = `<img src="${avatar}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; border-radius: inherit;" />`;
    } else {
      slot.innerHTML = '';
      slot.style.backgroundColor = '#161616';
    }
  });

  // 3. Populate Name & Slug & Bio
  const name = localStorage.getItem('ebio_workspace_name') || 'xxx';
  const slug = localStorage.getItem('ebio_workspace_slug') || 'xox';
  const bio = localStorage.getItem('ebio_workspace_bio') || '';

  document.querySelectorAll('.profile-name-target').forEach(el => el.textContent = name);
  document.querySelectorAll('.profile-handle-target').forEach(el => el.textContent = '@' + slug);
  document.querySelectorAll('.profile-slug-target').forEach(el => el.textContent = slug);
  document.querySelectorAll('.profile-bio-target').forEach(el => {
    if (bio) {
      el.textContent = bio;
      el.style.display = 'block';
    } else {
      el.style.display = 'none';
    }
  });

  // 4. Apply Cosmetics (Frame, Font, Glow)
  try {
    const cosmetics = JSON.parse(localStorage.getItem('ebio_cosmetics') || '{}');
    if (cosmetics.frame) {
      document.querySelectorAll('.avatar-frame-container').forEach(c => {
        c.className = c.className.replace(/frame-\w+/g, '') + ' frame-' + cosmetics.frame.toLowerCase();
      });
    }
    if (cosmetics.nameFont) {
      document.querySelectorAll('.profile-name-target').forEach(el => {
        el.style.fontFamily = cosmetics.nameFont === 'MONO' ? '"Courier New", Courier, monospace' : 'inherit';
      });
    }
    if (cosmetics.nameColor) {
      document.querySelectorAll('.profile-name-target').forEach(el => el.style.color = cosmetics.nameColor);
    }
  } catch(e) {}

  // 5. Populate Social Links
  try {
    const socials = JSON.parse(localStorage.getItem('ebio_user_socials') || '[]');
    const socialsTargets = document.querySelectorAll('.profile-socials-target');
    socialsTargets.forEach(target => {
      target.innerHTML = '';
      if (!socials || !socials.length) return;
      socials.forEach(item => {
        if (!item.enabled && item.enabled !== undefined) return;
        const pill = document.createElement('a');
        pill.className = 'social-pill';
        pill.href = item.val ? (item.val.startsWith('http') ? item.val : 'https://' + item.val) : '#';
        pill.target = '_blank';
        pill.innerHTML = `
          <img src="${item.icon ? (item.icon.startsWith('.') || item.icon.startsWith('/') || item.icon.startsWith('http') ? item.icon : './assets/socials/default/' + item.id + '.svg') : './assets/socials/default/' + item.id + '.svg'}" style="width: 14px; height: 14px; object-fit: contain;" onerror="this.style.display='none'" />
          <span>${item.name || item.id}</span>
        `;
        target.appendChild(pill);
      });
    });
  } catch(e) {}

  // 6. Populate Modules
  try {
    const modules = JSON.parse(localStorage.getItem('ebio_user_modules') || '[]');
    const countEl = document.querySelector('.profile-modules-count');
    if (countEl) countEl.textContent = modules.length;

    const modTargets = document.querySelectorAll('.profile-modules-target');
    if (modules && modules.length > 0) {
      modTargets.forEach(target => {
        target.style.display = 'flex';
        target.innerHTML = '';
        modules.forEach(mod => {
          const card = document.createElement('div');
          card.className = 'bg-[#141414] border border-[#222222] rounded-xl p-4 shadow-sm flex items-center justify-between text-white';
          card.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="text-sm font-semibold">${mod.name || 'Module'}</span>
            </div>
            <span class="text-xs text-neutral-400">${mod.desc || ''}</span>
          `;
          target.appendChild(card);
        });
      });
    }
  } catch(e) {}

  // 7. Apply Background Image
  const bg = localStorage.getItem('ebio_workspace_background');
  if (bg) {
    document.body.style.backgroundImage = `url(${bg})`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
  }

  // 8. Bloomberg Live Clock
  const clock = document.getElementById('bloomberg-clock');
  if (clock) {
    const updateClock = () => clock.textContent = new Date().toLocaleTimeString();
    updateClock();
    setInterval(updateClock, 1000);
  }

  // 9. 3D Tilt Effect for 3D-Profile
  const tiltCard = document.getElementById('tilt-card-container');
  if (tiltCard) {
    const handleMove = (e) => {
      const rect = tiltCard.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const deltaX = (e.clientX - centerX) / (window.innerWidth / 2);
      const deltaY = (e.clientY - centerY) / (window.innerHeight / 2);
      const rotateX = deltaY * -14;
      const rotateY = deltaX * 14;
      tiltCard.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
    };
    const handleLeave = () => {
      tiltCard.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    };
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseleave', handleLeave);
  }
}

// Particle Trail Canvas for Carambit / Cursor Cosmetic
(function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  const particles = [];
  function addParticle(x, y) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 1.5,
      vy: (Math.random() - 0.5) * 1.5 - 0.5,
      size: Math.random() * 2.5 + 1,
      alpha: 0.9,
      decay: Math.random() * 0.02 + 0.01
    });
  }

  window.addEventListener('mousemove', (e) => {
    for (let i = 0; i < 2; i++) {
      addParticle(e.clientX, e.clientY);
    }
  });

  // Ambient gentle drift particles
  for (let i = 0; i < 25; i++) {
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -Math.random() * 0.4 - 0.1,
      size: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.6 + 0.2,
      decay: 0.003
    });
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= p.decay;
      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

window.addEventListener('DOMContentLoaded', renderActiveProfileTheme);
window.addEventListener('storage', renderActiveProfileTheme);
</script>
